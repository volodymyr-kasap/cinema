name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, not just the tip commit, so the default
          # shallow clone would hide anything committed earlier.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:build
      # Testcontainers starts postgres:18-alpine itself; the runner's Docker
      # daemon is all it needs, so no service container is declared here.
      - run: npm run test -w @cinema/api

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:build
      - run: npm run test -w @cinema/web
      - run: npm run build -w @cinema/web

  e2e:
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker compose up -d --build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w @cinema/web
      - if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
