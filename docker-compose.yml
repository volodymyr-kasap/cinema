services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cinema -d cinema']
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      # PostgreSQL 18 changed the convention: a single mount at /var/lib/postgresql,
      # with the cluster in a versioned subdirectory. Mounting .../data instead —
      # correct for 17 and earlier — makes the 18 image refuse to start, reporting
      # the mount as unused. See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql

  # No volume, deliberately: the locks are advisory and the whole design says a
  # cold Redis must be survivable, so persisting them would preserve state that
  # is by definition disposable.
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 20

  # A volume, unlike redis: these messages are the record that a hold needs
  # settling, and a broker restart that lost them would leave rows for lazy
  # expiry to find by accident rather than by design.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cinema
      RABBITMQ_DEFAULT_PASS: cinema
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      # The broker takes longer to become useful than to open its port, and a
      # dependent that starts inside that window fails its first connection.
      start_period: 30s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # A separate service and a separate image, not a route on the API: proving
  # the breaker opens means stopping this container, and that must not take the
  # API down with it. No published port — its only client is the worker, and
  # nothing outside the network has any business charging cards.
  payment-provider:
    build:
      context: .
      dockerfile: apps/payment-provider/Dockerfile
    environment:
      PORT: '4000'
      PROVIDER_SUCCESS_RATE: ${PROVIDER_SUCCESS_RATE:-0.85}
      PROVIDER_DECLINE_RATE: ${PROVIDER_DECLINE_RATE:-0.1}
      PROVIDER_ERROR_RATE: ${PROVIDER_ERROR_RATE:-0.03}
      PROVIDER_TIMEOUT_RATE: ${PROVIDER_TIMEOUT_RATE:-0.02}
      PROVIDER_HANG_MS: ${PROVIDER_HANG_MS:-30000}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run as their own step, not from the app bootstrap: with more than
  # one API replica, parallel bootstraps would race each other over DDL.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cinema:cinema@postgres:5432/cinema
    command: ['node', 'apps/api/dist/db/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cinema:cinema@postgres:5432/cinema
    command: ['node', 'apps/api/dist/db/seed.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://cinema:cinema@postgres:5432/cinema
      LOG_LEVEL: info
      # REDIS_URL is set unconditionally while LOCK_STRATEGY defaults to `db`:
      # the variable is harmless when unused, and switching the whole stack to
      # the other strategy is then one environment variable rather than an edit.
      LOCK_STRATEGY: ${LOCK_STRATEGY:-db}
      REDIS_URL: redis://redis:6379
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      # Set unconditionally while the mode defaults to `lazy`, exactly as
      # REDIS_URL is: the variable is harmless when unused, and switching the
      # whole stack is then one environment variable rather than an edit.
      RESERVATION_EXPIRY_MODE: ${RESERVATION_EXPIRY_MODE:-lazy}
      RABBITMQ_URL: amqp://cinema:cinema@rabbitmq:5672
      PAYMENT_MODE: ${PAYMENT_MODE:-off}
      PAYMENT_PROVIDER_URL: http://payment-provider:4000
    # No published port: Compose will not map a fixed host port onto a scaled
    # service. Reach the API through nginx at http://localhost:8080/api/, or use
    # docker-compose.single-api.yml for the one-instance shape.
    deploy:
      replicas: ${API_REPLICAS:-3}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # The same image as the api, a different entry point. No published port and no
  # HTTP listener: this process consumes a queue and nothing else (ADR 0028).
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/worker/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cinema:cinema@postgres:5432/cinema
      LOG_LEVEL: info
      LOCK_STRATEGY: ${LOCK_STRATEGY:-db}
      REDIS_URL: redis://redis:6379
      RESERVATION_EXPIRY_MODE: ${RESERVATION_EXPIRY_MODE:-lazy}
      RABBITMQ_URL: amqp://cinema:cinema@rabbitmq:5672
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-20}
      PAYMENT_MODE: ${PAYMENT_MODE:-off}
      PAYMENT_PROVIDER_URL: http://payment-provider:4000
      PAYMENT_TIMEOUT_MS: ${PAYMENT_TIMEOUT_MS:-2000}
      PAYMENT_DEADLINE_SECONDS: ${PAYMENT_DEADLINE_SECONDS:-300}
      PAYMENT_BREAKER_FAILURE_THRESHOLD: ${PAYMENT_BREAKER_FAILURE_THRESHOLD:-5}
      PAYMENT_BREAKER_OPEN_MS: ${PAYMENT_BREAKER_OPEN_MS:-30000}
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      # The API takes no such dependency: it never calls the provider, and an
      # outage there has no business delaying API startup.
      payment-provider:
        condition: service_healthy
    # In the default `lazy` mode this process logs one line and exits 0. That is
    # success, not a crash, so the restart policy must not treat it as one --
    # `on-failure` restarts a non-zero exit and leaves a clean one alone.
    restart: on-failure
    # Long enough for the drain in onApplicationShutdown to finish the message
    # the worker is holding.
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

  # Inside the stack's network, and pointed at nginx: a generator on the host
  # loopback would compete with the browser and the dev server for the same
  # sockets, and would measure the port mapping as well as the API.
  k6:
    image: grafana/k6:latest
    profiles: ['load']
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE_URL: http://web
      API_REPLICAS: ${API_REPLICAS:-3}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
